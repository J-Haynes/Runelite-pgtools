name: Package

# Manual "Run workflow" button (Actions tab) - builds all three installers and attaches them to
# this run as downloadable Actions artifacts, no public release. Good for a quick test build.
#
# Pushing a tag like "v1.0.0" additionally publishes those same files to a GitHub Release - the
# actual public "click here to download" link for someone who isn't going to dig through the
# Actions tab. See CLAUDE.md's "Packaging for non-technical users" section for the jpackage side
# of this (the two Gradle tasks this workflow calls, and their known limitations).
on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact-glob: runelite-client/build/jpackage/installer/*.deb
          - os: windows-latest
            artifact-glob: runelite-client/build/jpackage/installer/*.exe
          - os: macos-latest
            artifact-glob: runelite-client/build/jpackage/installer/*.dmg

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write # only actually used by the release-publish step below, on a tag push

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Only for setup-gradle's cache cleanup at the end of the job: it runs the runner's own
      # Gradle (9.x), which needs Java 17+, so with JAVA_HOME on 11 it failed ("Cache cleanup
      # failed" warning). The last step below switches JAVA_HOME to this one for it.
      - name: Set up JDK 17 (cache cleanup)
        id: jdk17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Matches CI.yml - JDK 11 is what actually builds/compiles the client on every OS. jpackage
      # itself needs a JDK 14+; the Gradle toolchain wired up in settings.gradle.kts auto-downloads
      # a JDK 17 for just that step, same as it does on a local machine. Set up last, so it's the
      # JAVA_HOME the build uses.
      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 11

      # v5, not v6: v6 changed the action's license terms (blog.gradle.org/github-actions-for-gradle-v6).
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper

      - name: Install fakeroot + desktop-file-utils (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot desktop-file-utils

      # jpackage's --type exe needs the WiX Toolset (v3). windows-latest runners normally ship
      # with it already, but this installs it on demand instead of assuming - cheap insurance
      # against a GitHub-side image change silently breaking the Windows build.
      - name: Ensure WiX Toolset is available (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Get-Item (not Get-ChildItem -Directory, which listed the folders INSIDE bin - there are
          # none, so nothing was ever added to PATH) resolves the wildcard to the bin folder itself.
          # Fails loudly if it's still not found, rather than letting jpackage fail later with a
          # less obvious "WiX not found" error.
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --no-progress -y
            $wixBin = Get-Item "${env:ProgramFiles(x86)}\WiX Toolset*\bin" | Select-Object -First 1
            if (-not $wixBin) { throw "WiX Toolset bin folder not found after install" }
            Add-Content -Path $env:GITHUB_PATH -Value $wixBin.FullName
          }

      - name: Build installer
        run: ./gradlew :client:jpackageInstaller

      # Catches the two ways the .deb has already broken on a real machine: an invalid .desktop
      # entry (jpackage's default "Categories=Unknown") and a Depends line apt can't satisfy.
      - name: Validate .deb (Linux)
        if: runner.os == 'Linux'
        run: |
          deb=$(ls runelite-client/build/jpackage/installer/*.deb)
          dpkg-deb -I "$deb"
          mkdir -p "$RUNNER_TEMP/deb" && dpkg-deb -x "$deb" "$RUNNER_TEMP/deb"
          find "$RUNNER_TEMP/deb/opt" -maxdepth 3 -name '*.desktop' -print0 | xargs -0 -n1 desktop-file-validate
          sudo apt-get install -y --simulate "./$deb"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: runelite-pvp-tools-${{ matrix.os }}
          path: ${{ matrix.artifact-glob }}

      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.artifact-glob }}

      # Must stay the last step: setup-gradle's cache cleanup runs after it, in the post-job phase.
      - name: Use JDK 17 for Gradle cache cleanup
        shell: bash
        run: echo "JAVA_HOME=${{ steps.jdk17.outputs.path }}" >> "$GITHUB_ENV"
